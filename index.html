<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="张洋的个人主页：AI 三维重建、世界模型、自动驾驶仿真。">
  <meta name="color-scheme" content="light dark">
  <title>张洋 · 个人主页</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">
  <nav class="nav" aria-label="主导航">
    <div class="wrap"><a class="brand" href="#top"></a><ul></ul></div>
  </nav>

  <main id="top">
    <header class="hero">
      <div class="wrap">
        <h1 id="hero-name"></h1>
        <p class="sub" id="hero-sub"></p>
        <div class="actions">
          <a class="btn primary" href="#projects">查看项目</a>
          <a class="btn ghost" id="resume-link" href="#">下载简历</a>
        </div>
      </div>
    </header>

    <section id="about" class="alt">
      <div class="wrap narrow">
        <h2 class="reveal">关于</h2>
        <div class="about reveal" id="about-body"></div>
      </div>
    </section>

    <section id="projects">
      <div class="wrap">
        <h2 class="reveal">精选项目</h2>
        <div class="grid two" id="project-grid"></div>
      </div>
    </section>

    <section id="skills" class="alt">
      <div class="wrap">
        <h2 class="reveal">技能</h2>
        <dl class="skills" id="skill-list"></dl>
      </div>
    </section>

    <section id="contact">
      <div class="wrap contact reveal">
        <h2>联系</h2>
        <p id="contact-intro"></p>
        <a class="mail" id="mail" href="#"></a>
        <div class="links"><a id="github" href="#" rel="noopener">GitHub</a></div>
      </div>
    </section>
  </main>

  <footer><small>© <span id="year"></span></small></footer>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
